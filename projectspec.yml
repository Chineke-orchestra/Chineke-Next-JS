client: chineke
application: chinekefe
repository: 'Hogarth-Worldwide/di-chineke-main-frontend.git'
notify: devopssec
framework: react
versions:
  nodejs: 16
react:
  endpoint: .next/standalone/server.js
  port: 3058
build:
  theme:
    nodejs: 'nodejs-18'
    install: '$(which npm) install --legacy-peer-deps'
    build: 'pwd'
    artifacts:
      - '*.txt'
  application:
    dependencies:
      - 'package.json'
      - 'package-lock.json'
      - .next
      - next.config.js
      - .env
      - public
      - assets
      - components
      - lib
      - pages
      - public
      - scripts
      - styles
      - types
      - utils